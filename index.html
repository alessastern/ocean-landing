<!DOCTYPE html>
<html lang="en">
  <head></head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" href="./assets/favicon-96x96.png" sizes="96x96"/>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
<link rel="shortcut icon" href="./assets/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Ocean Landing" />
<link rel="manifest" href="./assets/site.webmanifest" />
    <title>Ocean landing</title>
  </head>
  <body>
    <script src="./scripts/contact.js"></script>
    <div class="modal-backdrop" onclick="closeContactModal(event)">
      <div class="contact-form">
        <button id="closeButton" onclick="closeContactModal(event)">X</button>
        <div class="item"></div>
        <div class="price"></div>
        <form class="form" id="contact-form" onsubmit="handleSubmit(event)">
          <input name="name" type="text" placeholder="Ivan Ivanov" required />
          <input name="phone" type="tel" placeholder="+7 000-00-00" required />
          <input name="email" type="email" placeholder="example@mail.com" />
          <input name="offer" type="hidden">
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
    <div class="page">
      <div class="block-1" id="main">
        <div class="header">
          <h1 class="title">Ocean</h1>
          <a href="#main">Main</a>
          <a href="#offers">Offers</a>
          <a href="#contacts">Contacts</a>
          <div class="contacts">
            <a href="tel:79111111111">+7(911)111-11-11</a>
            <button class="form_button" onclick="showContactModal()">
              Contact
            </button>
          </div>
        </div>
      </div>
      <div class="container">
        <div class="text">
          <div class="text-l">Performance</div>
          <div class="text-c">Adaptability</div>
          <div class="text-r">Usability</div>
        </div>
        <div class="description">Our product offers many useful things, so contact us now to get the best offer!</div>
        <div class="offers" id="offers">
          <script src="./scripts/offers.js"></script>
        </div>
        <div id="contacts" class="contacts-block">
          <a href="messenger">@messenger-link</a>
          <a href="tel:+79999999999">+7 (911) 111-11-11</a>
          <a href="mailto:mail@user.com">mail@user.com</a>
          <button class="form_button" onclick="showContactModal()">
            Call me back!
          </button>
        </div>
      </div>
      <a href="#main" class="up">^</a>
      <div class="footer">2025 | Test Landing</div>
    </div>
  </body>
</html>
